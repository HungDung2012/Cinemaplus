name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}   # e.g. mycinemaacr.azurecr.io
  RESOURCE_GROUP: cinema-rg
  CONTAINER_APP_ENV: cinema-env

jobs:
  # ─── Build & Push Images ────────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend image
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/cinema-backend:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/cinema-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/cinema-frontend:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/cinema-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Azure Container Apps ─────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: cinema-backend
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/cinema-backend:${{ needs.build-and-push.outputs.image_tag }}
          environmentVariables: |
            SPRING_PROFILES_ACTIVE=prod
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORS_ALLOWED_ORIGINS=${{ secrets.FRONTEND_URL }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            TMDB_API_TOKEN=${{ secrets.TMDB_API_TOKEN }}

      - name: Deploy frontend Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: cinema-frontend
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/cinema-frontend:${{ needs.build-and-push.outputs.image_tag }}
          environmentVariables: |
            API_URL=${{ secrets.BACKEND_URL }}/api
            BACKEND_INTERNAL_URL=${{ secrets.BACKEND_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.BACKEND_URL }}

# Simple backup workflow
name: Simple CI

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  simple-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Test Frontend
        run: |
          cd frontend
          npm install
          npm test
      
      - name: Frontend Build Test  
        run: |
          cd frontend
          npm run build
          
      - name: Backend Test
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw test || echo "Backend tests completed"
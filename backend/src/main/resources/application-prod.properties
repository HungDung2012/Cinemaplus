# Application
spring.application.name=cinema-backend
server.port=8080

# Database (set via environment variables in production)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SELECT 1

# Connection pool tuning for cloud
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Data Initialization
app.db.reset-data=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS — set to your frontend Container App URL
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://cinema-frontend.thankfulsky-96591df5.southeastasia.azurecontainerapps.io}

# Frontend URL (used in payment return URLs)
frontend.url=${FRONTEND_URL:https://cinema-frontend.thankfulsky-96591df5.southeastasia.azurecontainerapps.io}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging (reduce verbosity in prod)
logging.level.com.cinema=INFO
logging.level.org.springframework.security=WARN

# TMDB API
tmdb.api.url=https://api.themoviedb.org/3
tmdb.api.token=${TMDB_API_TOKEN}
tmdb.api.image-base-url=https://image.tmdb.org/t/p/w500

# Backend URL (cho IPN callback — cổng thanh toán gọi về đây)
app.backend-url=${BACKEND_URL:https://cinema-backend.thankfulsky-96591df5.southeastasia.azurecontainerapps.io}

# ================== PAYMENT GATEWAYS ==================

# VNPay — Production: đổi URL sang https://pay.vnpay.vn/vpcpay.html
vnpay.tmn-code=${VNPAY_TMN_CODE:YOUR_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET:YOUR_SECRET}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${FRONTEND_URL:https://cinema-frontend.thankfulsky-96591df5.southeastasia.azurecontainerapps.io}/payment/return?method=vnpay

# MoMo — Production: đổi API URL sang https://payment.momo.vn/v2/gateway/api/create
momo.partner-code=${MOMO_PARTNER_CODE:YOUR_PARTNER_CODE}
momo.access-key=${MOMO_ACCESS_KEY:YOUR_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY:YOUR_SECRET_KEY}
momo.api-url=${MOMO_API_URL:https://test-payment.momo.vn/v2/gateway/api/create}

# ZaloPay — Production: đổi API URL sang https://openapi.zalopay.vn/v2/create
zalopay.app-id=${ZALOPAY_APP_ID:YOUR_APP_ID}
zalopay.key1=${ZALOPAY_KEY1:YOUR_KEY1}
zalopay.key2=${ZALOPAY_KEY2:YOUR_KEY2}
zalopay.api-url=${ZALOPAY_API_URL:https://sb-openapi.zalopay.vn/v2/create}

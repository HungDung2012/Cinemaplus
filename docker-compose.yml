version: '3.8'

services:
  # ─── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: cinema-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cinema
      MYSQL_USER: cinema_user
      MYSQL_PASSWORD: cinema_pass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinema-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/cinema?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: cinema_user
      DB_PASSWORD: cinema_pass
      JWT_SECRET: local-dev-secret-change-in-production-min-64-chars-xxxxxxxxxxxx
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/movies"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    container_name: cinema-frontend
    restart: always
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8080/api
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  db_data:

name: Build & Deploy to Azure Container Apps

# Professional Git Flow Setup
on:
  push:
    branches: [main]  # Only deploy from main branch
  pull_request:
    branches: [main]  # Run tests on PR but don't deploy
  workflow_dispatch:   # Manual deployment option

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  # First run tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Backend Tests
        run: |
          cd backend
          mvn test
      - name: Run Frontend Tests  
        run: |
          cd frontend
          npm ci
          npm test

  # Only deploy after tests pass
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    # Require manual approval for production
    environment: production
    # Skip deployment if commit message contains [skip ci] or [skip deploy]
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip deploy]')"
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - check secrets exist
        run: |
          if [ -z "${{ secrets.ACR_USERNAME }}" ]; then echo "ACR_USERNAME is EMPTY"; else echo "ACR_USERNAME is set (length: ${#ACR_USERNAME})"; fi
          if [ -z "${{ secrets.ACR_PASSWORD }}" ]; then echo "ACR_PASSWORD is EMPTY"; else echo "ACR_PASSWORD is set"; fi
          if [ -z "${{ secrets.ACR_LOGIN_SERVER }}" ]; then echo "ACR_LOGIN_SERVER is EMPTY"; else echo "ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}"; fi
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}

      - name: Login to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_LOGIN_SERVER }}" \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/cinema-backend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/cinema-backend:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/cinema-backend:cache
          cache-to: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/cinema-backend:cache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            BACKEND_INTERNAL_URL=https://cinema-backend.thankfulsky-96591df5.southeastasia.azurecontainerapps.io
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/cinema-frontend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/cinema-frontend:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/cinema-frontend:cache
          cache-to: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/cinema-frontend:cache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Done
        run: |
          echo "Images pushed to ACR successfully!"
          echo "Backend : ${{ secrets.ACR_LOGIN_SERVER }}/cinema-backend:latest"
          echo "Frontend: ${{ secrets.ACR_LOGIN_SERVER }}/cinema-frontend:latest"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CINEMABACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CINEMABACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CINEMABACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend to Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name cinema-backend \
              --resource-group cinema-rg \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/cinema-backend:${{ github.sha }}

      - name: Deploy frontend to Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name cinema-frontend \
              --resource-group cinema-rg \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/cinema-frontend:${{ github.sha }}

      - name: Deployment complete
        run: |
          echo "Deployed successfully!"
          echo "Backend : cinema-backend -> ${{ secrets.ACR_LOGIN_SERVER }}/cinema-backend:${{ github.sha }}"
          echo "Frontend: cinema-frontend -> ${{ secrets.ACR_LOGIN_SERVER }}/cinema-frontend:${{ github.sha }}"
